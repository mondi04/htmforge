name: Release to PyPI & GitHub Pages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 0.5.0). Leave empty to skip release."
        required: false
        type: string

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # For creating GitHub releases and tags

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Get full git history for version detection

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]" build twine

      - name: Run tests
        run: pytest

      - name: Type check
        run: mypy htmforge/

      - name: Lint
        run: ruff check htmforge/

      - name: Build documentation
        run: python -m mkdocs build --strict

      - name: Build distribution
        run: python -m build

      - name: Create git tag
        if: github.event.inputs.version != ''
        run: |
          TAG="v${{ github.event.inputs.version }}"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: github.event.inputs.version != ''
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}
          files: dist/*
          body: "Release v${{ github.event.inputs.version }}\n\nSee [CHANGELOG](https://github.com/mondi04/htmforge/blob/main/OVERVIEW.md) for details."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to PyPI
        if: github.event.inputs.version != ''
        run: |
          twine upload dist/* --non-interactive
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

      - name: Deploy docs to GitHub Pages
        if: github.event.inputs.version != ''
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site