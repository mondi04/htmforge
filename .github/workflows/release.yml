name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  pages: write

jobs:
  validate:
    name: Validate tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag points to a commit reachable from main
        run: |
          TAG_COMMIT=$(git rev-list -n 1 ${{ github.ref_name }})
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "ERROR: Tag ${{ github.ref_name }} is not on main!"
            exit 1
          fi

  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Type check
        run: mypy htmforge/

      - name: Lint
        run: ruff check htmforge/

  release:
    name: Build, publish & deploy
    runs-on: ubuntu-latest
    needs: test
    environment: release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,docs]" build

      - name: Build distribution
        run: python -m build

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Extract changelog section
        id: changelog
        run: |
          python - <<'EOF'
          import re, pathlib, os
          version = os.environ["VERSION"]
          text = pathlib.Path("docs/changelog.md").read_text()
          pattern = rf"## \[{re.escape(version)}\].*?\n(.*?)(?=\n## \[|\Z)"
          match = re.search(pattern, text, re.DOTALL)
          body = match.group(1).strip() if match else "See CHANGELOG for details."
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"BODY<<EOF\n{body}\nEOF\n")
          EOF
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}

      - name: Build documentation
        run: python -m mkdocs build --strict

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: htmforge ${{ steps.version.outputs.VERSION }}
          body: ${{ steps.changelog.outputs.BODY }}
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'a') || contains(steps.version.outputs.VERSION, 'b') || contains(steps.version.outputs.VERSION, 'rc') }}
          files: |
            dist/*.whl
            dist/*.tar.gz

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Deploy docs to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site