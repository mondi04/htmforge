name: Release to PyPI & GitHub Pages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 0.5.0). Leave empty to skip release."
        required: false
        type: string

permissions:
  contents: write
  id-token: write  # For OIDC token generation

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: release  # Optional but recommended for extra safety

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]" build

      - name: Run tests
        run: pytest

      - name: Type check
        run: mypy htmforge/

      - name: Lint
        run: ruff check htmforge/

      - name: Build documentation
        run: python -m mkdocs build --strict

      - name: Build distribution
        run: python -m build

      - name: Create git tag
        if: github.event.inputs.version != ''
        run: |
          TAG="v${{ github.event.inputs.version }}"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: github.event.inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          files: dist/*
          body: "Release v${{ github.event.inputs.version }}\n\nSee [CHANGELOG](https://github.com/mondi04/htmforge/blob/main/OVERVIEW.md) for details."
          draft: false
          prerelease: false

      - name: Publish to PyPI
        if: github.event.inputs.version != ''
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Deploy docs to GitHub Pages
        if: github.event.inputs.version != ''
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site