name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Tests + Type Check  (Matrix: 3.11 / 3.12 / 3.13)
  # ---------------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest --cov=htmforge --cov-report=xml --cov-report=term-missing

      - name: Upload coverage (3.12 only)
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

      - name: Type check
        run: mypy htmforge/

  # ---------------------------------------------------------------------------
  # Linting & Formatting
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Ruff — check style
        run: ruff check htmforge/

      - name: Ruff — check formatting
        run: ruff format --check htmforge/

  # ---------------------------------------------------------------------------
  # Theme CSS Sync Check
  # ---------------------------------------------------------------------------
  theme_sync:
    name: Theme CSS sync
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check htmforge-theme.css is in sync with admin.css
        run: |
          if ! diff -q examples/admin-panel/static/admin.css docs/assets/css/htmforge-theme.css > /dev/null; then
            echo "::error::docs/assets/css/htmforge-theme.css ist nicht synchron mit examples/admin-panel/static/admin.css"
            echo "Quelle (admin.css) wurde geändert, ohne die Kopie (htmforge-theme.css) nachzuziehen."
            diff examples/admin-panel/static/admin.css docs/assets/css/htmforge-theme.css || true
            exit 1
          fi
          echo "✅ htmforge-theme.css ist synchron mit admin.css"

  # ---------------------------------------------------------------------------
  # Summary — einziger Required Check für Branch Protection
  # ---------------------------------------------------------------------------
  ci-success:
    name: CI
    runs-on: ubuntu-latest
    needs: [test, lint, theme_sync]
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.test.result }}" != "success" || "${{ needs.lint.result }}" != "success" || "${{ needs.theme_sync.result }}" != "success" ]]; then
            echo "❌  test=${{ needs.test.result }}  lint=${{ needs.lint.result }}  theme_sync=${{ needs.theme_sync.result }}"
            exit 1
          fi
          echo "✅ All checks passed"